name: Build and Push Docker Image

on:
  push:
    branches:
      - "first_feature"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-app

      - name: Setup SSH
        run: |
           mkdir -p ~/.ssh
           # Inject private key from GitHub Secrets
           echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
           chmod 600 ~/.ssh/id_rsa
           # Add EC2 to known hosts (avoid prompt)
           ssh-keyscan -H ubuntu@100.53.134.144 >> ~/.ssh/known_hosts
      - name: deploy on ec2
        run: |
          ssh ubuntu@100.53.134.144 << 'EOF'
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
          docker stop myapp || true
          docker rm myapp || true
          docker run -d -p 8080:8080 --name myapp ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
        EOF
